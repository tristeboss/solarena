<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solana Arena</title>
    <!-- Czcionka Rubik Bold -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #111318;
            color: #ffffff;
            font-family: Arial, sans-serif;
        }

        /* Pasek z symetrycznym układem po lewej i prawej stronie */
        .navbar {
            width: 100%;
            height: 66px;
            background-color: #111318;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-left: 22%;
            padding-right: 22%; /* Dokładnie ta sama odległość od prawej krawędzi co logo od lewej */
            border-bottom: 1px solid #22252e;
            overflow: visible;
        }

        /* Lewa strona: główne logo */
        .nav-left {
            display: flex;
            align-items: center;
        }

        .nav-left img {
            height: 90px;
            width: auto;
            display: block;
        }

        /* Prawa strona: saldo + przycisk Connect */
        .nav-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .balance-box {
            display: flex;
            align-items: center;
            gap: 10px;
            height: 40px;
            padding: 0 14px;
            background-color: #1a1d24;
            border: 1px solid #262a34;
            border-radius: 8px;
            color: #ffffff;
            font-family: 'Rubik', sans-serif;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: background-color 0.15s ease, border-color 0.15s ease;
        }

        .balance-box:hover {
            background-color: #20242d;
            border-color: #343946;
        }

        .balance-box img {
            width: 20px;
            height: 20px;
            object-fit: contain;
            display: block;
        }

        .chevron {
            color: #9aa0b0;
            font-size: 11px;
            margin-left: 2px;
        }

        /* Przycisk Connect w kolorze czerwonej ikony */
        .connect-btn {
            height: 40px;
            padding: 0 16px;
            background-color: #ff3b3b;
            border: none;
            border-radius: 8px;
            color: #ffffff;
            font-family: 'Rubik', sans-serif;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: background-color 0.15s ease, transform 0.1s ease;
        }

        .connect-btn:hover {
            background-color: #e62e2e;
        }

        .connect-btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <header class="navbar">
        <div class="nav-left">
            <img src="Nowy projekt (78).png" alt="Logo">
        </div>

        <div class="nav-right">
            <div class="balance-box" id="balanceBox">
                <img src="Nowy projekt (79).png" alt="Ikona waluty">
                <span id="balanceAmount">PLN 0.00</span>
                <span class="chevron">⌄</span>
            </div>
            <button class="connect-btn" id="connectBtn">Connect</button>
        </div>
    </header>

    <script>
        const connectBtn = document.getElementById('connectBtn');
        const balanceAmount = document.getElementById('balanceAmount');

        connectBtn.addEventListener('click', () => {
            if (connectBtn.textContent === 'Connect') {
                connectBtn.textContent = 'Connected';
                connectBtn.style.backgroundColor = '#22a06b';
                balanceAmount.textContent = 'PLN 125.00';
            } else {
                connectBtn.textContent = 'Connect';
                connectBtn.style.backgroundColor = '#ff3b3b';
                balanceAmount.textContent = 'PLN 0.00';
            }
        });
    </script>

</body>
</html>
