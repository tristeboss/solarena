<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solana Arena</title>
    <!-- Czcionka Rubik Bold -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #111318;
            color: #ffffff;
            font-family: Arial, sans-serif;
        }

        /* Pasek górny oparty na siatce 3-kolumnowej dla idealnego wycentrowania środka */
        .navbar {
            width: 100%;
            height: 66px;
            background-color: #111318;
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            padding-left: 22%;
            padding-right: 22%;
            border-bottom: 1px solid #22252e;
            overflow: visible;
        }

        /* Lewa kolumna: logo dosunięte do lewej krawędzi kontenera */
        .nav-left {
            justify-self: start;
            display: flex;
            align-items: center;
        }

        .nav-left img {
            height: 90px;
            width: auto;
            display: block;
        }

        /* Środkowa kolumna: licznik pieniędzy dokładnie na środku u góry */
        .nav-center {
            justify-self: center;
            display: flex;
            align-items: center;
        }

        .balance-box {
            display: flex;
            align-items: center;
            gap: 10px;
            height: 40px;
            padding: 0 14px;
            background-color: #1a1d24;
            border: 1px solid #262a34;
            border-radius: 8px;
            color: #ffffff;
            font-family: 'Rubik', sans-serif;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            white-space: nowrap;
            transition: background-color 0.15s ease, border-color 0.15s ease;
        }

        .balance-box:hover {
            background-color: #20242d;
            border-color: #343946;
        }

        .balance-box img {
            width: 20px;
            height: 20px;
            object-fit: contain;
            display: block;
        }

        .chevron {
            color: #9aa0b0;
            font-size: 11px;
            margin-left: 2px;
        }

        /* Prawa kolumna: przycisk Connect dosunięty do prawej krawędzi kontenera */
        .nav-right {
            justify-self: end;
            display: flex;
            align-items: center;
        }

        .connect-btn {
            height: 40px;
            padding: 0 18px;
            background-color: #ff1e1e;
            border: none;
            border-radius: 8px;
            color: #ffffff;
            font-family: 'Rubik', sans-serif;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            white-space: nowrap;
            transition: background-color 0.15s ease, transform 0.1s ease;
        }

        .connect-btn:hover {
            background-color: #e01919;
        }

        .connect-btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <header class="navbar">
        <div class="nav-left">
            <img src="Nowy projekt (78).png" alt="Logo">
        </div>

        <div class="nav-center">
            <div class="balance-box" id="balanceBox">
                <img src="Nowy projekt (79).png" alt="Ikona waluty">
                <span id="balanceAmount">PLN 0.00</span>
                <span class="chevron">⌄</span>
            </div>
        </div>

        <div class="nav-right">
            <button class="connect-btn" id="connectBtn">Connect</button>
        </div>
    </header>

    <script>
        const connectBtn = document.getElementById('connectBtn');
        const balanceAmount = document.getElementById('balanceAmount');

        connectBtn.addEventListener('click', () => {
            if (connectBtn.textContent === 'Connect') {
                connectBtn.textContent = 'Connected';
                connectBtn.style.backgroundColor = '#22a06b';
                balanceAmount.textContent = 'PLN 125.00';
            } else {
                connectBtn.textContent = 'Connect';
                connectBtn.style.backgroundColor = '#ff1e1e';
                balanceAmount.textContent = 'PLN 0.00';
            }
        });
    </script>

</body>
</html>
