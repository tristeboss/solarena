<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moja Strona</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #2b2b2b; /* Szare tło strony */
            color: #ffffff;
            font-family: Arial, sans-serif;
        }

        /* Pasek na górze */
        .navbar {
            width: 100%;
            height: 70px;
            background-color: #1f1f1f;
            display: flex;
            align-items: center;
            padding-left: 25%;
            border-bottom: 1px solid #3a3a3a;
            overflow: visible; /* Pozwala obrazkowi wystawać poza pasek */
        }

        /* Powiększony obrazek wystający lekko poza pasek */
        .navbar img {
            height: 95px; /* Zwiększona wysokość (pasek ma 70px, więc wystaje) */
            width: auto;
            position: relative;
            top: 8px; /* Lekkie przesunięcie w dół, żeby nie dotykał górnej krawędzi ekranu */
            z-index: 10; /* Upewnia się, że obrazek będzie zawsze na wierzchu */
        }
    </style>
</head>
<body>

    <header class="navbar">
        <img src="Nowy projekt (77).png" alt="Logo">
    </header>

</body>
</html>
