<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moja Strona</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #2b2b2b; /* Szare tło strony */
            color: #ffffff;
            font-family: Arial, sans-serif;
        }

        /* Pasek na górze */
        .navbar {
            width: 100%;
            height: 70px;
            background-color: #1f1f1f; /* Nieco ciemniejszy szary dla kontrastu */
            display: flex;
            align-items: center;
            padding-left: 25%; /* Przesunięcie od lewej strony (nie na maxa, tylko w stronę środka) */
            border-bottom: 1px solid #3a3a3a;
        }

        /* Styl dla Twojego obrazka */
        .navbar img {
            max-height: 45px; /* Dopasowanie wysokości do paska */
            width: auto;
        }
    </style>
</head>
<body>

    <header class="navbar">
        <img src="Nowy projekt (77).png" alt="Logo">
    </header>

</body>
</html>
