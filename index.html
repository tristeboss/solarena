<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solana Arena</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #2b2b2b; /* Szare tło strony */
            color: #ffffff;
            font-family: Arial, sans-serif;
        }

        /* Pasek na górze */
        .navbar {
            width: 100%;
            height: 70px;
            background-color: #181818; /* Ciemniejszy szary pasek */
            display: flex;
            align-items: center; /* Idealne wyśrodkowanie w pionie */
            padding-left: 25%;
            border-bottom: 1px solid #3a3a3a;
            overflow: hidden; /* Gwarantuje, że nic nie wyjdzie poza pasek */
        }

        /* Logo idealnie wyśrodkowane i mieszczące się w pasku */
        .navbar img {
            height: 56px; /* Duże, ale mieści się wewnątrz 70px paska */
            width: auto;
            display: block;
        }
    </style>
</head>
<body>

    <header class="navbar">
        <img src="Nowy projekt (77).png" alt="Logo">
    </header>

</body>
</html>
