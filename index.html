<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solana Arena</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #181818; /* Jednolity ciemnoszary kolor dla całej strony */
            color: #ffffff;
            font-family: Arial, sans-serif;
        }

        /* Pasek na górze - bez własnego tła, zostaje tylko dolna kreska */
        .navbar {
            width: 100%;
            height: 76px;
            background-color: transparent;
            display: flex;
            align-items: center;
            padding-left: 25%;
            border-bottom: 1px solid #333333; /* Sama dolna kreska */
            overflow: hidden;
        }

        /* Minimalnie powiększone logo */
        .navbar img {
            height: 62px;
            width: auto;
            display: block;
        }
    </style>
</head>
<body>

    <header class="navbar">
        <img src="Nowy projekt (78).png" alt="Logo">
    </header>

</body>
</html>
