<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solana Arena</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #111318; /* Ciemny odcień jak na screenie z Shuffle */
            color: #ffffff;
            font-family: Arial, sans-serif;
        }

        /* Pasek o identycznych proporcjach jak na przykładzie */
        .navbar {
            width: 100%;
            height: 66px;
            background-color: #111318;
            display: flex;
            align-items: center;
            padding-left: 25%; /* Pozycja od lewej strony */
            border-bottom: 1px solid #22252e; /* Cienka, subtelna linia oddzielająca */
            overflow: visible;
        }

        /* Logo dopasowane rozmiarem do paska */
        .navbar img {
            height: 90px; /* Skompensowane pod puste marginesy w pliku PNG */
            width: auto;
            display: block;
        }
    </style>
</head>
<body>

    <header class="navbar">
        <img src="Nowy projekt (78).png" alt="Solana Arena">
    </header>

</body>
</html>
